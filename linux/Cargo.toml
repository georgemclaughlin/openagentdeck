[package]
name = "openagentdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Native GNOME monitor for existing Codex sessions"

[features]
default = ["desktop"]
desktop = ["dep:gtk", "dep:adw"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tempfile = "3"
unicode-general-category = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true

